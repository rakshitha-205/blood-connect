spring.application.name=bloodconnect-backend
spring.config.import=optional:file:./config/.env[.properties],optional:file:./backend/config/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_connect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

bloodconnect.jwt.secret=${JWT_SECRET}
bloodconnect.jwt.expiration=${JWT_EXPIRATION:PT1H}
bloodconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

bloodconnect.otp.required=true
bloodconnect.otp.phone-required=false
bloodconnect.otp.expose-dev-code=false
bloodconnect.otp.mail-from=${MAIL_FROM:${SMTP_USERNAME:no-reply@bloodconnect.local}}
bloodconnect.otp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
bloodconnect.otp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
bloodconnect.otp.twilio.from-number=${TWILIO_FROM_NUMBER:}
bloodconnect.app-url=${APP_URL:http://localhost:5500}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:465}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

bloodconnect.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
bloodconnect.ai.openrouter.model=${OPENROUTER_MODEL:google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3-super-120b-a12b:free}
