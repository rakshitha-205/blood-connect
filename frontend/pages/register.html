<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - BloodConnect</title>

    <link rel="stylesheet" href="/assets/css/style.css?v=2" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a class="logo" href="/">🩸 BloodConnect</a>

        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/nearby-donors">Find Donor</a>
          <a href="/emergency-request">Emergency</a>
          <a href="/about">About</a>
          <a class="login-btn" href="/login">Login</a>
        </div>
      </nav>
    </header>

    <section class="register-page">
      <div class="register-container">
        <div class="register-logo">🩸 BloodConnect</div>

        <h1 class="register-title">Create Account</h1>

        <p class="register-subtitle">Join the community and help save lives.</p>

        <!-- Registration Form -->

        <form id="registerForm">
          <!-- Name -->

          <div class="form-group">
            <label for="name"> Full Name </label>

            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <!-- Email -->

          <div class="form-group">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Phone -->

          <div class="form-group">
            <label for="phone"> Phone Number </label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter your phone number"
              required
            />
          </div>

          <!-- User Type -->

          <div class="form-group">
            <label for="userType"> Register As </label>

            <select id="userType" required>
              <option value="">Select User Type</option>

              <option value="donor">🩸 Blood Donor</option>

              <option value="patient">🚨 Patient</option>

              <option value="hospital">🏥 Hospital</option>

              <option value="bloodbank">🏦 Blood Bank</option>
            </select>
          </div>

          <!-- Donor Fields -->

          <div id="donorFields">
            <h3>🩸 Donor Information</h3>

            <!-- Blood Group -->

            <div class="form-group">
              <label for="bloodGroup"> Blood Group </label>

              <select id="bloodGroup">
                <option value="">Select Blood Group</option>

                <option value="A+">A+</option>

                <option value="A-">A-</option>

                <option value="B+">B+</option>

                <option value="B-">B-</option>

                <option value="AB+">AB+</option>

                <option value="AB-">AB-</option>

                <option value="O+">O+</option>

                <option value="O-">O-</option>
              </select>
            </div>

            <!-- Location -->

            <div class="form-group">
              <label for="location"> Location </label>

              <input
                type="text"
                id="location"
                placeholder="Enter your city / area"
              />
            </div>

            <div class="form-group">
              <button type="button" class="ghost-btn" id="useDonorLocation">Use my current location</button>
              <span id="donorLocationMessage" aria-live="polite"></span>
              <input type="hidden" id="latitude" />
              <input type="hidden" id="longitude" />
            </div>

            <!-- Availability -->

            <div class="form-group">
              <label for="availability"> Availability </label>

              <select id="availability">
                <option value="">Select Availability</option>

                <option value="available">🟢 Available</option>

                <option value="unavailable">🔴 Currently Unavailable</option>
              </select>
            </div>
          </div>

          <!-- Password -->

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              type="password"
              id="password"
              placeholder="At least 10 characters"
              minlength="10"
              maxlength="72"
              required
            />
          </div>

          <!-- Confirm Password -->

          <div class="form-group">
            <label for="confirmPassword"> Confirm Password </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              required
            />
          </div>

          <!-- Register Button -->

          <p id="formMessage" role="status" aria-live="polite"></p>
          <button type="submit" class="register-submit">Create Account</button>
        </form>

        <!-- Login -->

        <p class="login-text">
          Already have an account?

          <a href="/login"> Login </a>
        </p>

        <!-- Home -->

        <a href="/" class="back-home"> ← Back to Home </a>
      </div>
    </section>

    <script src="/assets/js/core/config.js?v=2"></script>
    <script src="/assets/js/core/session.js?v=2"></script>
    <script src="/assets/js/core/http.js?v=2"></script>
    <script src="/assets/js/core/ui.js?v=2"></script>
    <script src="/assets/js/core/location.js?v=2"></script>
    <script src="/assets/js/core/navigation.js?v=2"></script>
    <script src="/assets/js/core/password-toggle.js?v=2"></script>
    <script src="/assets/js/pages/register.js?v=2"></script>
  </body>
</html>
