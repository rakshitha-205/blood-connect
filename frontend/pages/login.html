<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BloodConnect</title>

    <link rel="stylesheet" href="/assets/css/style.css?v=2">

</head>

<body>

    <header>
        <nav class="navbar">
            <a class="logo" href="/">🩸 BloodConnect</a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/nearby-donors">Find Donor</a>
                <a href="/emergency-request">Emergency</a>
                <a href="/about">About</a>
                <a class="login-btn" href="/login">Login</a>
            </div>
        </nav>
    </header>

    <section class="login-page">

        <div class="login-container">

            <div class="login-logo">
                🩸 BloodConnect
            </div>

            <h1 class="login-title">
                Welcome Back
            </h1>

            <p class="login-subtitle">
                Login to continue helping save lives.
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- User Type -->

                <div class="form-group">

                    <label for="userType">
                        Login As
                    </label>

                    <select id="userType" required>

                        <option value="">
                            Select User Type
                        </option>

                        <option value="donor">
                            🩸 Donor
                        </option>

                        <option value="patient">
                            🚨 Patient
                        </option>

                        <option value="hospital">
                            🏥 Hospital
                        </option>

                        <option value="bloodbank">
                            🏦 Blood Bank
                        </option>

                        <option value="admin">
                            🛡️ Admin
                        </option>

                    </select>

                </div>

                <p id="loginNotice" class="login-notice" role="status" hidden></p>

                <p id="formMessage" role="status" aria-live="polite"></p>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Forgot Password -->

                <a href="/forgot-password" class="forgot-password" id="forgotPasswordLink">
                    Forgot Password?
                </a>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>

            </form>


            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


            <!-- Home -->

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>


    <script src="/assets/js/core/config.js?v=2"></script>
    <script src="/assets/js/core/session.js?v=2"></script>
    <script src="/assets/js/core/http.js?v=2"></script>
    <script src="/assets/js/core/ui.js?v=2"></script>
    <script src="/assets/js/core/location.js?v=2"></script>
    <script src="/assets/js/core/navigation.js?v=2"></script>
    <script src="/assets/js/core/password-toggle.js?v=2"></script>
    <script src="/assets/js/pages/login.js?v=2"></script>

</body>

</html>
